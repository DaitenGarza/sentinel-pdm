[build-system]
# 77+ understands the SPDX `license` string below (PEP 639) and builds wheels without the
# separate `wheel` package.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-pdm"
version = "1.0.0"
description = "Fleet-level predictive maintenance for industrial centrifugal pumps: failure-risk, remaining-useful-life and failure-mode models with an operator dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daiten Garza" }]
keywords = ["predictive maintenance", "condition monitoring", "machine learning", "industrial", "reliability", "pumps"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyarrow>=14",
    "plotly>=5.18",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sentinel-pdm = "sentinel_pdm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
